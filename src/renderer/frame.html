<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Klip — Marco</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
    .frame { position: absolute; inset: 0; border: 2px dashed #ff453a; border-radius: 3px; }
    .paused .frame { border-color: #ffcc00; }
    #count { position: absolute; inset: 0; display: grid; place-items: center; font: 700 96px "Segoe UI", system-ui, sans-serif;
      color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.6); background: rgba(0,0,0,.25); }
    #count:empty { display: none; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div id="count" role="timer" aria-live="assertive"></div>
  <script src="frame.js"></script>
</body>
</html>
