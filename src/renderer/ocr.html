<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Klip — Texto reconocido</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #1e1e24; color: #e8e8ee; font: 13px "Segoe UI", system-ui, sans-serif; }
    body { display: flex; flex-direction: column; border: 1px solid #3a3a45; }
    header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #26262e; -webkit-app-region: drag; }
    header strong { flex: 1; }
    #meta { color: #a0a0ad; font-size: 12px; }
    textarea { flex: 1; margin: 10px; resize: none; background: #15151a; color: #e8e8ee; border: 1px solid #3a3a45;
      border-radius: 8px; padding: 10px; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
    textarea:focus { outline: 2px solid #5b5bf7; outline-offset: -1px; }
    footer { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 0 10px 10px; }
    #status { flex: 1; color: #a0a0ad; font-size: 12px; }
    button { font: inherit; color: #fff; background: rgba(255,255,255,.1); border: 0; border-radius: 7px; padding: 7px 14px;
      cursor: pointer; -webkit-app-region: no-drag; }
    button:hover, button:focus-visible { background: rgba(255,255,255,.2); outline: none; }
    .primary { background: #5b5bf7; }
    .primary:hover { background: #6d6dff; }
  </style>
</head>
<body>
  <header>
    <strong>Texto reconocido</strong>
    <span id="meta"></span>
    <button id="x" aria-label="Cerrar" title="Cerrar (Esc)">✕</button>
  </header>
  <textarea id="text" aria-label="Texto reconocido, editable" spellcheck="false"></textarea>
  <footer>
    <span id="status" role="status">Ya está copiado en el portapapeles.</span>
    <button id="oneline" title="Unir todas las líneas en una">Una línea</button>
    <button id="copy" class="primary" title="Copiar (Ctrl+Enter)">Copiar</button>
  </footer>
  <script src="ocr.js"></script>
</body>
</html>
