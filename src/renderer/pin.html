<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Klip — Fijada</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: move; user-select: none; }
    img { width: 100%; height: 100%; display: block; pointer-events: none; }
    #x { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 0;
      color: #fff; background: rgba(15,15,20,.8); cursor: pointer; opacity: 0; transition: opacity .15s; }
    body:hover #x, #x:focus-visible { opacity: 1; }
    #help { position: absolute; left: 6px; bottom: 6px; color: #fff; background: rgba(15,15,20,.8);
      font: 11px "Segoe UI", system-ui, sans-serif; padding: 3px 8px; border-radius: 6px; opacity: 0;
      transition: opacity .15s; pointer-events: none; }
    body:hover #help { opacity: 1; }
  </style>
</head>
<body>
  <img id="img" alt="Captura fijada">
  <button id="x" aria-label="Cerrar" title="Cerrar (Esc)">✕</button>
  <div id="help">Rueda: zoom · Ctrl+rueda: opacidad · Clic derecho: menú</div>
  <script src="pin.js"></script>
</body>
</html>
